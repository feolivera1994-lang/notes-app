<!DOCTYPE html>
<html>
<head>
  <title>My Notes</title>
</head>
<body>
  <h1>My Notes</h1>

  <div id="authSection">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="signup()">Sign up</button>
    <button onclick="login()">Log in</button>
    <p id="authMessage"></p>
  </div>

  <div id="notesSection" style="display: none;">
    <p>Logged in as <b id="currentUser"></b> <button onclick="logout()">Log out</button></p>
    <input id="noteText" placeholder="Write a note">
    <button onclick="addNote()">Add</button>
    <ul id="notesList"></ul>
  </div>

  <script>
    function showNotes(username) {
      document.getElementById("authSection").style.display = "none";
      document.getElementById("notesSection").style.display = "block";
      document.getElementById("currentUser").textContent = username;
      loadNotes();
    }

    function showAuth() {
      document.getElementById("authSection").style.display = "block";
      document.getElementById("notesSection").style.display = "none";
    }

    async function sendAuth(path) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value
        })
      });
      const data = await response.json();
      if (response.ok) {
        document.getElementById("authMessage").textContent = "";
        showNotes(data.username);
      } else {
        document.getElementById("authMessage").textContent = data.detail;
      }
    }

    function signup() { sendAuth("/signup"); }
    function login() { sendAuth("/login"); }

    async function logout() {
      await fetch("/logout", { method: "POST" });
      showAuth();
    }

    async function checkLogin() {
      const response = await fetch("/me");
      if (response.ok) {
        const data = await response.json();
        showNotes(data.username);
      } else {
        showAuth();
      }
    }

    async function loadNotes() {
      const response = await fetch("/notes");
      if (!response.ok) { showAuth(); return; }
      const notes = await response.json();
      const list = document.getElementById("notesList");
      list.innerHTML = "";
      for (const note of notes) {
        const item = document.createElement("li");
        item.textContent = note.text + " ";

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.onclick = () => editNote(note.id, note.text);
        item.appendChild(editButton);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.onclick = () => deleteNote(note.id);
        item.appendChild(deleteButton);

        list.appendChild(item);
      }
    }

    async function addNote() {
      const input = document.getElementById("noteText");
      await fetch("/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: input.value })
      });
      input.value = "";
      loadNotes();
    }

    async function editNote(id, currentText) {
      const newText = prompt("Edit your note:", currentText);
      if (newText === null || newText.trim() === "") return;
      await fetch("/notes/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: newText })
      });
      loadNotes();
    }

    async function deleteNote(id) {
      await fetch("/notes/" + id, { method: "DELETE" });
      loadNotes();
    }

    checkLogin();
  </script>
</body>
</html>
